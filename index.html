<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu  Cafe</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=El+Messiri:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <h1>☕ Menu  Cafe</h1>
  <div class="cart-icon" id="cartIconTop">🛒 <span id="count">0</span></div>
</header>
<section id="backSection" style="display:none;">
  <button id="backBtn">⇦ </button>
</section>

<section class="categories" id="categories">
  <button onclick="showCategory('hot')">
    <img src="6456166615651615615.jpg" class="cat-icon">
   المشروبات الساخنة
  </button>

  <button onclick="showCategory('cold')">
    <img src="51515654645645312.jpg" class="cat-icon">
   المشروبات البارده
  </button>

  <button onclick="showCategory('dessert')">
    <img src="36996.png" class="cat-icon">
    dessert
  </button>

  <button onclick="showCategory('shisha')">
    <img src="546516165161616165151.png" class="cat-icon">
    Shisha
  </button>


</section>

<section id="products" class="products"></section>

<div class="cart-popup" id="cartPopup">
  <span class="close-btn" id="closeCart">×</span>
  <h2>السلة</h2>
  <div id="cartItems"></div>
  <h3 id="total">الإجمالي: 0 EGP</h3>

  <div class="cart-inputs">
    <input type="text" id="tableNumber" placeholder="رقم الترابيزة (إجباري)">
    <textarea id="notes" placeholder="الملاحظات: لاضافة اي شىء خارج المنيو (اختياري)"></textarea>
  </div>

  <button id="orderBtn">اطلب الآن</button>
</div>

<div class="cart-icon-bottom" id="cartIconBottom">🛒 <span id="countBottom">0</span></div>

<script src="script.js"></script>
</body>
</html>
